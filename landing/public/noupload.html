<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add No Memes</title><link rel="stylesheet" href="/upload.css"><script src="/upload.js" defer></script></head><body><main><h1>Add a No meme</h1><p>Upload an image to add it to the random rotation.</p><form id="login"><label>Host PIN or password<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button id="unlock">Unlock uploads</button><p class="hint">Uses the same host sign-in as your party site. First sign-in may take a minute while the free server wakes up.</p></form><section id="manager" hidden><form id="upload"><label>Choose a meme<input id="file" type="file" accept="image/gif,image/png,image/jpeg,image/webp" required></label><p class="hint">GIF, PNG, JPEG or WebP. Up to 8 MB. Uploaded memes are public on the main page.</p><img id="preview" alt="Meme preview" hidden><button id="save">Add to rotation</button></form><button id="lock" type="button">Lock uploads</button><p><a href="/" target="_blank" rel="noopener">View the meme page ↗</a></p></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
